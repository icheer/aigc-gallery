<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>AIGC Gallery</title>
<link rel="preconnect" href="https://fonts.loli.net">
<link href="https://fonts.loli.net/css2?family=Archivo:wght@400;500;600;700&family=Archivo+Black&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/photoswipe@5.4.4/dist/photoswipe.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/photoswipe-dynamic-caption-plugin@1.2.7/photoswipe-dynamic-caption-plugin.css">
<script src="https://unpkg.com/lucide@1.59.0/dist/umd/lucide.min.js"></script>
<style>
:root {
  --bg: #0B0B0E;
  --bg-soft: #101014;
  --card: #141419;
  --card-hover: #17171d;
  --border: rgba(255,255,255,.08);
  --border-strong: rgba(255,255,255,.16);
  --text: #EDEDF0;
  --muted: #8B8B95;
  --accent: #0077BC;
  --accent-bright: #58B7F2;
  --accent-soft: rgba(0,119,188,.14);
  --danger: #E5534B;
  --success: #3FB950;
  --radius: 14px;
  --font-body: 'Archivo', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --font-display: 'Archivo Black', 'Archivo', sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  font-family: var(--font-body); color: var(--text); background: var(--bg);
  -webkit-font-smoothing: antialiased;
  min-height: 100vh; display: flex; flex-direction: column;
}
img { display: block; }
button { font-family: inherit; cursor: pointer; color: inherit; background: none; border: none; }
input, textarea, select { font-family: inherit; font-size: 14px; color: var(--text); }
a { color: inherit; }
::selection { background: var(--accent); color: #fff; }

.lucide { width: 16px; height: 16px; stroke-width: 2; }

/* ---------- Header ---------- */
.site-header {
  position: sticky; top: 0; z-index: 50;
  background: rgba(11,11,14,.82); backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--border);
}
.header-inner {
  max-width: 1240px; margin: 0 auto; padding: 0 28px;
  height: 60px; display: flex; align-items: center; gap: 14px;
}
.logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
.logo-badge {
  width: 32px; height: 32px; border-radius: 9px; flex: none;
  display: grid; place-items: center;
  background: linear-gradient(135deg, var(--accent), #0a4d78);
  box-shadow: 0 2px 12px rgba(0,119,188,.35);
}
.logo-badge .lucide { width: 17px; height: 17px; color: #fff; }
.logo-word { font-family: var(--font-display); font-size: 15px; letter-spacing: .06em; }
.logo-word b { color: var(--accent-bright); font-weight: 400; }
.header-spacer { flex: 1; }

.auth-box { display: flex; align-items: center; gap: 8px; }
.auth-box input {
  width: 148px; height: 34px; padding: 0 12px;
  background: var(--bg-soft); border: 1px solid var(--border); border-radius: 9px;
  outline: none; transition: border-color .18s, background .18s; font-size: 13px;
}
.auth-box input::placeholder { color: var(--muted); }
.auth-box input:focus { border-color: var(--accent); background: var(--card); }
.auth-box.shake { animation: shake .32s; }
@keyframes shake { 25% { transform: translateX(-4px);} 75% { transform: translateX(4px);} }
.authed-badge {
  display: none; align-items: center; gap: 8px;
  font-size: 12px; color: var(--success);
}
.authed-badge .lucide { width: 14px; height: 14px; }
.authed-badge button { color: var(--muted); font-size: 12px; text-decoration: underline; }
.authed-badge button:hover { color: var(--text); }
body.authed .auth-box input, body.authed .btn-unlock { display: none; }
body.authed .authed-badge { display: flex; }

.admin-actions { display: none; gap: 8px; }
body.authed .admin-actions { display: flex; }

/* ---------- Buttons ---------- */
.btn {
  height: 34px; padding: 0 14px; border-radius: 9px;
  font-size: 13px; font-weight: 600;
  display: inline-flex; align-items: center; gap: 7px;
  transition: background .18s, border-color .18s, transform .1s, box-shadow .18s;
}
.btn:active { transform: scale(.97); }
.btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }
.btn .lucide { width: 14px; height: 14px; }
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover:not(:disabled) { background: #0088d4; box-shadow: 0 4px 16px rgba(0,119,188,.4); }
.btn-ghost { background: transparent; color: var(--text); border: 1px solid var(--border-strong); }
.btn-ghost:hover:not(:disabled) { border-color: var(--accent-bright); color: var(--accent-bright); }
.btn-danger-ghost { color: var(--danger); border: 1px solid transparent; }
.btn-danger-ghost:hover { border-color: var(--danger); }
.btn-sm { height: 30px; padding: 0 10px; font-size: 12px; }

/* ---------- Main ---------- */
main { flex: 1; width: 100%; max-width: 1240px; margin: 0 auto; padding: 36px 28px 110px; }

/* 首页标题区(紧凑,非 banner) */
.page-intro { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 28px; }
.page-intro h1 { font-family: var(--font-display); font-size: clamp(22px, 3.4vw, 30px); letter-spacing: .02em; }
.page-intro .sub { margin-top: 8px; color: var(--muted); font-size: 13.5px; }
.page-intro .stats { font-family: var(--font-mono); font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.page-intro .stats b { color: var(--accent-bright); font-weight: 500; }

.section-head { display: flex; align-items: baseline; justify-content: space-between; margin: 34px 0 18px; }
.section-head h2 { font-size: 15px; font-weight: 700; letter-spacing: .04em; color: var(--muted); text-transform: uppercase; }
.section-head .count { font-family: var(--font-mono); font-size: 12px; color: var(--muted); opacity: .8; }

/* ---------- Folder grid ---------- */
.folder-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 22px; }
.folder-card {
  position: relative;
  background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
  overflow: hidden; cursor: pointer; text-decoration: none; display: block;
  transition: transform .22s, border-color .22s, background .22s, box-shadow .22s;
}
.folder-card:hover { transform: translateY(-3px); border-color: var(--border-strong); background: var(--card-hover); box-shadow: 0 14px 40px rgba(0,0,0,.45); }
.folder-cover { aspect-ratio: 16/10; background: var(--bg-soft); overflow: hidden; position: relative; }
.folder-cover img { width: 100%; height: 100%; object-fit: cover; transition: transform .3s ease; }
.folder-card:hover .folder-cover img { transform: scale(1.04); }
.folder-cover .cover-fallback {
  position: absolute; inset: 0; display: grid; place-items: center; color: #3a3a44;
}
.folder-cover .cover-fallback .lucide { width: 44px; height: 44px; stroke-width: 1.4; }
.folder-body { padding: 15px 16px 14px; }
.folder-body h3 { font-size: 15.5px; font-weight: 700; letter-spacing: .01em; }
.folder-body p {
  margin-top: 6px; font-size: 13px; color: var(--muted); line-height: 1.55;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.folder-meta { margin-top: 11px; display: flex; align-items: center; gap: 6px; font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); }
.folder-meta .lucide { width: 13px; height: 13px; }
.folder-meta .works { color: var(--accent-bright); }
.folder-del {
  display: none; position: absolute; top: 10px; right: 10px; z-index: 2;
  background: rgba(10,10,14,.72); backdrop-filter: blur(6px);
}
.folder-del:hover { background: var(--danger); border-color: transparent; }
body.authed .folder-del { display: inline-flex; }

/* ---------- Folder detail ---------- */
.crumb {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 13px; color: var(--muted); text-decoration: none; margin-bottom: 22px;
  transition: color .18s;
}
.crumb:hover { color: var(--accent-bright); }
.crumb .lucide { width: 14px; height: 14px; }
.folder-detail-head { margin-bottom: 26px; }
.folder-detail-head h2 { font-family: var(--font-display); font-size: clamp(24px, 3.6vw, 34px); letter-spacing: .015em; }
.folder-detail-head p { margin-top: 10px; color: var(--muted); font-size: 14px; max-width: 680px; line-height: 1.65; }
.folder-detail-head .folder-meta { margin-top: 14px; }

.image-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
.image-cell {
  position: relative; border-radius: 12px; overflow: hidden; cursor: zoom-in;
  background: var(--bg-soft); aspect-ratio: 1/1;
  transition: transform .18s, outline-color .18s;
  outline: 1px solid transparent; outline-offset: -1px;
}
.image-cell:hover { outline-color: var(--accent-bright); transform: translateY(-2px); }
.image-cell img { width: 100%; height: 100%; object-fit: cover; }
.image-cell .image-del {
  display: none; position: absolute; top: 8px; right: 8px; z-index: 2;
  background: rgba(10,10,14,.72); backdrop-filter: blur(6px);
}
.image-cell .image-del:hover { background: var(--danger); border-color: transparent; }
body.authed .image-cell .image-del { display: inline-flex; }

/* ---------- Empty ---------- */
.empty {
  text-align: center; padding: 84px 24px; color: var(--muted);
  border: 1px dashed var(--border-strong); border-radius: var(--radius); background: var(--bg-soft);
}
.empty .lucide { width: 40px; height: 40px; stroke-width: 1.4; color: #3a3a44; margin: 0 auto 16px; }
.empty .big { font-size: 16px; font-weight: 700; color: var(--text); margin-bottom: 8px; }
.empty p { font-size: 13.5px; margin-bottom: 22px; }

/* ---------- Dialog ---------- */
.dialog-backdrop {
  position: fixed; inset: 0; background: rgba(5,5,8,.68); backdrop-filter: blur(4px); z-index: 100;
  display: none; align-items: flex-start; justify-content: center; padding: 6vh 16px 16px;
  overflow-y: auto;
}
.dialog-backdrop.open { display: flex; }
.dialog {
  background: var(--card); border: 1px solid var(--border-strong);
  border-radius: 16px; width: 100%; max-width: 500px;
  padding: 26px; box-shadow: 0 28px 80px rgba(0,0,0,.6);
  animation: dialogIn .22s cubic-bezier(.2,.9,.3,1);
}
@keyframes dialogIn { from { opacity: 0; transform: translateY(14px) scale(.98); } }
.dialog h3 { font-size: 17px; font-weight: 700; margin-bottom: 20px; display: flex; align-items: center; gap: 9px; }
.dialog h3 .lucide { width: 17px; height: 17px; color: var(--accent-bright); }
.dialog .field { margin-bottom: 15px; }
.dialog label { display: block; font-size: 12.5px; font-weight: 600; margin-bottom: 7px; color: var(--text); }
.dialog label .opt { color: var(--muted); font-weight: 400; font-size: 12px; }
.dialog input[type=text], .dialog input[type=password], .dialog textarea, .dialog select {
  width: 100%; border: 1px solid var(--border); border-radius: 9px;
  padding: 10px 12px; outline: none; background: var(--bg-soft);
  transition: border-color .18s; font-size: 13.5px;
}
.dialog input:focus, .dialog textarea:focus, .dialog select:focus { border-color: var(--accent); }
.dialog textarea { resize: vertical; min-height: 60px; }
.dialog .actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }

.pick-zone {
  border: 1.5px dashed var(--border-strong); border-radius: 12px; padding: 26px;
  text-align: center; cursor: pointer; color: var(--muted); font-size: 13px;
  transition: border-color .18s, background .18s;
}
.pick-zone:hover, .pick-zone.drag { border-color: var(--accent); background: var(--accent-soft); }
.pick-zone.has-img { padding: 0; border-style: solid; }
.pick-zone img { width: 100%; max-height: 250px; object-fit: contain; background: var(--bg-soft); border-radius: 10px; }
.folder-select-row { display: flex; gap: 8px; }
.folder-select-row select { flex: 1; }
.prompt-row { display: flex; gap: 8px; align-items: stretch; }
.prompt-row input { flex: 1; }
.ai-btn {
  flex: none; width: 42px; border: 1px solid var(--border); border-radius: 9px;
  display: grid; place-items: center; color: var(--muted);
  transition: border-color .18s, color .18s, transform .14s;
}
.ai-btn .lucide { width: 16px; height: 16px; }
.ai-btn:hover:not(:disabled) { border-color: #e8b339; color: #e8b339; transform: scale(1.07); }
.ai-btn:disabled { opacity: .45; cursor: not-allowed; }
.ai-btn.spinning .lucide { animation: spin 1.1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.form-status { font-size: 12.5px; margin-top: 4px; min-height: 17px; color: var(--muted); }
.form-status.ok { color: var(--success); }
.form-status.err { color: var(--danger); }

/* ---------- Lightbox(PhotoSwipe) ---------- */
.pswp { --pswp-bg: rgba(7,7,10,.96); }
.pswp__dynamic-caption .lb-title { font-size: 15px; font-weight: 700; color: var(--text); }
.pswp__dynamic-caption .lb-desc { font-size: 13px; margin-top: 4px; color: var(--muted); line-height: 1.6; }

/* ---------- Toast ---------- */
.toast {
  position: fixed; left: 50%; bottom: 32px; transform: translateX(-50%) translateY(16px);
  background: #1c1c23; border: 1px solid var(--border-strong); color: var(--text);
  padding: 11px 20px; border-radius: 10px; font-size: 13px; z-index: 300;
  opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; max-width: 90vw;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.err { border-color: var(--danger); }
.toast.ok { border-color: var(--success); }

footer { border-top: 1px solid var(--border); padding: 26px 24px; text-align: center; }
footer p { font-family: var(--font-mono); font-size: 11.5px; color: #55555e; letter-spacing: .04em; }
footer p a { color: inherit; text-decoration: none; transition: color .18s; }
footer p a:hover { color: var(--accent-bright); }

/* ---------- 移动端 ---------- */
@media (max-width: 640px) {
  .header-inner { padding: 0 16px; height: 56px; }
  .logo-word { display: none; }
  .auth-box input { width: 104px; }
  main { padding: 24px 16px 88px; }
  .page-intro { flex-direction: column; align-items: flex-start; gap: 10px; }
  .folder-grid { grid-template-columns: 1fr 1fr; gap: 12px; }
  .folder-body { padding: 11px 12px 10px; }
  .folder-body h3 { font-size: 13.5px; }
  .folder-body p { display: none; }
  .image-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
}
</style>
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a class="logo" href="#/">
      <span class="logo-badge"><i data-lucide="aperture"></i></span>
      <span class="logo-word">AIGC <b>Gallery</b></span>
    </a>
    <div class="header-spacer"></div>
    <div class="admin-actions">
      <button class="btn btn-ghost btn-sm" id="btn-new-folder"><i data-lucide="folder-plus"></i>文件夹</button>
      <button class="btn btn-primary btn-sm" id="btn-upload"><i data-lucide="upload"></i>上传</button>
    </div>
    <div class="auth-box" id="auth-box">
      <input type="password" id="auth-input" placeholder="认证码" autocomplete="off">
      <button class="btn btn-primary btn-sm btn-unlock" id="btn-unlock">解锁</button>
      <span class="authed-badge">
        <i data-lucide="unlock"></i>已解锁
        <button id="btn-lock">退出</button>
      </span>
    </div>
  </div>
</header>

<main id="app"></main>

<footer><p>AIGC GALLERY · <a href="https://keyi.ma" target="_blank" rel="noopener">作者主页</a></p></footer>

<!-- 新建文件夹 -->
<div class="dialog-backdrop" id="dlg-folder">
  <div class="dialog">
    <h3><i data-lucide="folder-plus"></i>新建文件夹</h3>
    <div class="field">
      <label>标题</label>
      <input type="text" id="folder-title" placeholder="例如: 手机壁纸 / 海报设计 / AI Memes" maxlength="40">
    </div>
    <div class="field">
      <label>描述 <span class="opt">(选填)</span></label>
      <textarea id="folder-desc" placeholder="这个主题是关于什么的" maxlength="200"></textarea>
    </div>
    <div class="form-status" id="folder-status"></div>
    <div class="actions">
      <button class="btn btn-ghost" data-close>取消</button>
      <button class="btn btn-primary" id="btn-folder-submit">创建</button>
    </div>
  </div>
</div>

<!-- 上传图片 -->
<div class="dialog-backdrop" id="dlg-upload">
  <div class="dialog">
    <h3><i data-lucide="upload"></i>上传图片</h3>
    <div class="field">
      <label>图片</label>
      <div class="pick-zone" id="pick-zone">
        <div id="pick-empty">
          <div>点击选择图片,或拖拽到此处</div>
          <div style="margin-top:6px; opacity:.7; font-size:12px;">JPEG / PNG / WebP / GIF</div>
        </div>
        <img id="pick-preview" alt="预览" style="display:none">
      </div>
      <input type="file" id="file-input" accept="image/*" style="display:none">
    </div>
    <div class="field">
      <label>所属文件夹</label>
      <div class="folder-select-row">
        <select id="upload-folder"></select>
        <button class="btn btn-ghost btn-sm" id="btn-new-folder-inline" style="height:auto;">新建</button>
      </div>
    </div>
    <div class="field">
      <label>标题</label>
      <input type="text" id="img-title" placeholder="图片标题" maxlength="60">
    </div>
    <div class="field">
      <label>描述 <span class="opt">(选填)</span></label>
      <textarea id="img-desc" placeholder="图片描述" maxlength="300"></textarea>
    </div>
    <div class="field">
      <label>Prompt <span class="opt">(选填,亦可作为 AI 识别的补充提示)</span></label>
      <div class="prompt-row">
        <input type="text" id="img-prompt" placeholder="生成提示词">
        <button class="ai-btn" id="btn-ai" title="AI 识别:自动填写标题与描述"><i data-lucide="sparkles"></i></button>
      </div>
    </div>
    <div class="form-status" id="upload-status"></div>
    <div class="actions">
      <button class="btn btn-ghost" data-close>取消</button>
      <button class="btn btn-primary" id="btn-upload-submit"><i data-lucide="upload"></i>上传</button>
    </div>
  </div>
</div>

<!-- 灯箱(PhotoSwipe 动态挂载) -->
<div class="pswp" tabindex="-1" role="dialog" aria-hidden="true"></div>

<div class="toast" id="toast"></div>

<script type="module">
"use strict";

import PhotoSwipeLightbox from "https://cdn.jsdelivr.net/npm/photoswipe@5.4.4/dist/photoswipe-lightbox.esm.js";
import PhotoSwipeDynamicCaption from "https://cdn.jsdelivr.net/npm/photoswipe-dynamic-caption-plugin@1.2.7/photoswipe-dynamic-caption-plugin.esm.js";

// ================= 全局状态 =================
const LS_KEY = "aigc_auth_code";
const THUMB_MAX = 512;      // 缩略图最大边长(px)
const AI_IMG_MAX = 1024;    // 发给视觉模型的最大边长(px)

const state = {
  authCode: localStorage.getItem(LS_KEY) || "",
  authed: false,
  folders: [],
  currentFolderId: null,
  images: [],
  uploadFile: null,
  uploadThumb: null,
  uploadDims: null,
};

const $ = (s) => document.querySelector(s);
const app = $("#app");
const refreshIcons = () => window.lucide && lucide.createIcons();

// ================= 工具 =================
function toast(msg, type = "") {
  const el = $("#toast");
  el.textContent = msg;
  el.className = "toast show " + type;
  clearTimeout(el._t);
  el._t = setTimeout(() => (el.className = "toast " + type), 2600);
}
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function fmtDate(ts) {
  const d = new Date(ts);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}
async function api(path, opts = {}) {
  const res = await fetch(path, opts);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `请求失败 (${res.status})`);
  return data;
}

// ================= 认证 =================
async function tryAuth(code, { silent = false } = {}) {
  if (!code) return false;
  try {
    await api("/api/verify", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ code }),
    });
    state.authCode = code;
    state.authed = true;
    localStorage.setItem(LS_KEY, code);
    document.body.classList.add("authed");
    render();
    return true;
  } catch (e) {
    if (!silent) {
      toast(e.message, "err");
      const box = $("#auth-box");
      box.classList.remove("shake");
      void box.offsetWidth;
      box.classList.add("shake");
    }
    return false;
  }
}
function lock() {
  state.authed = false;
  state.authCode = "";
  localStorage.removeItem(LS_KEY);
  document.body.classList.remove("authed");
  render();
}

// ================= 图片处理 =================
function loadImageEl(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error("图片读取失败"));
    img.src = src;
  });
}
// 高质量等比压缩:逐级减半降采样(避免一次性大幅缩小的锯齿),输出 JPEG Blob
async function compressImage(file, maxW, maxH, quality) {
  const url = URL.createObjectURL(file);
  try {
    const img = await loadImageEl(url);
    const sw = img.naturalWidth, sh = img.naturalHeight;
    const scale = Math.min(1, maxW / sw, maxH / sh);
    const tw = Math.max(1, Math.round(sw * scale));
    const th = Math.max(1, Math.round(sh * scale));

    // 第一张 canvas:原尺寸
    let cur = document.createElement("canvas");
    cur.width = sw; cur.height = sh;
    let cctx = cur.getContext("2d");
    cctx.imageSmoothingEnabled = true;
    cctx.imageSmoothingQuality = "high";
    cctx.drawImage(img, 0, 0);

    // 反复减半,直到再减半就会小于目标尺寸(消锯齿的关键)
    while (Math.floor(cur.width / 2) >= tw && Math.floor(cur.height / 2) >= th) {
      const half = document.createElement("canvas");
      half.width = Math.floor(cur.width / 2);
      half.height = Math.floor(cur.height / 2);
      const hctx = half.getContext("2d");
      hctx.imageSmoothingEnabled = true;
      hctx.imageSmoothingQuality = "high";
      hctx.drawImage(cur, 0, 0, half.width, half.height);
      cur = half;
    }

    // 最终精确缩放到目标尺寸
    const out = document.createElement("canvas");
    out.width = tw; out.height = th;
    const octx = out.getContext("2d");
    octx.imageSmoothingEnabled = true;
    octx.imageSmoothingQuality = "high";
    octx.drawImage(cur, 0, 0, tw, th);
    return await new Promise((resolve) =>
      out.toBlob((b) => resolve(b), "image/jpeg", quality));
  } finally {
    URL.revokeObjectURL(url);
  }
}

// ================= 路由与渲染 =================
async function loadFolders() {
  const data = await api("/api/folders");
  state.folders = data.folders;
}
async function loadImages(folderId) {
  const data = await api(`/api/folders/${encodeURIComponent(folderId)}/images`);
  state.images = data.images;
}

function render() {
  const m = (location.hash || "#/").match(/^#\/f\/([^/]+)/);
  if (m) renderFolder(m[1]);
  else renderHome();
}

async function renderHome() {
  state.currentFolderId = null;
  await loadFolders();
  const fs = state.folders;
  const totalWorks = fs.reduce((n, f) => n + (f.count || 0), 0);

  const cards = fs.map((f) => `
    <a class="folder-card" href="#/f/${esc(f.id)}">
      <button class="btn btn-danger-ghost btn-sm folder-del" data-del-folder="${esc(f.id)}"><i data-lucide="trash-2"></i></button>
      <div class="folder-cover">
        ${f.coverThumb
          ? `<img src="${esc(f.coverThumb)}" alt="${esc(f.title)}" loading="lazy">`
          : `<div class="cover-fallback"><i data-lucide="folder"></i></div>`}
      </div>
      <div class="folder-body">
        <h3>${esc(f.title)}</h3>
        ${f.description ? `<p>${esc(f.description)}</p>` : ""}
        <div class="folder-meta">
          <i data-lucide="image"></i>
          <span class="works">${f.count || 0}</span>
          <span>· ${fmtDate(f.createdAt)}</span>
        </div>
      </div>
    </a>`).join("");

  app.innerHTML = `
    <div class="page-intro">
      <div>
        <h1>Gallery</h1>
        <p class="sub">按主题归档的 AI 生成作品</p>
      </div>
      <div class="stats"><b>${fs.length}</b> folders · <b>${totalWorks}</b> works</div>
    </div>
    ${fs.length
      ? `<div class="folder-grid">${cards}</div>`
      : `<div class="empty">
           <i data-lucide="folder-open"></i>
           <div class="big">还没有文件夹</div>
           <p>${state.authed ? "创建第一个主题文件夹,开始归档你的作品。" : "输入认证码解锁后即可创建主题文件夹并上传作品。"}</p>
           ${state.authed
             ? `<button class="btn btn-primary" onclick="document.getElementById('btn-new-folder').click()"><i data-lucide="folder-plus"></i>创建文件夹</button>`
             : ""}
         </div>`}`;
  refreshIcons();
  bindDeleteButtons();
}

async function renderFolder(folderId) {
  state.currentFolderId = folderId;
  let folder;
  try {
    await loadFolders();
    folder = state.folders.find((f) => f.id === folderId);
    if (!folder) throw new Error("not found");
    await loadImages(folderId);
  } catch (e) {
    app.innerHTML = `<div class="empty"><i data-lucide="folder-open"></i><div class="big">文件夹不存在</div>
      <p>它可能已被删除。</p><a class="btn btn-ghost" href="#/">返回首页</a></div>`;
    refreshIcons();
    return;
  }
  const imgs = state.images;
  const cells = imgs.map((im, i) => `
    <div class="image-cell" data-idx="${i}" title="${esc(im.title)}">
      <button class="btn btn-danger-ghost btn-sm image-del" data-del-image="${esc(im.id)}"><i data-lucide="trash-2"></i></button>
      <img src="${esc(im.thumbUrl || im.url)}" alt="${esc(im.title)}" loading="lazy">
    </div>`).join("");

  app.innerHTML = `
    <a class="crumb" href="#/"><i data-lucide="arrow-left"></i>所有文件夹</a>
    <div class="folder-detail-head">
      <h2>${esc(folder.title)}</h2>
      ${folder.description ? `<p>${esc(folder.description)}</p>` : ""}
      <div class="folder-meta">
        <i data-lucide="image"></i>
        <span class="works">${imgs.length}</span>
        <span>works</span>
      </div>
    </div>
    ${imgs.length
      ? `<div class="image-grid">${cells}</div>`
      : `<div class="empty"><i data-lucide="image"></i><div class="big">空文件夹</div>
          <p>${state.authed ? "上传第一张图片吧。" : "该文件夹还没有图片。"}</p>
          ${state.authed ? `<button class="btn btn-primary" onclick="openUpload('${esc(folder.id)}')"><i data-lucide="upload"></i>上传图片</button>` : ""}
        </div>`}`;
  refreshIcons();
  app.querySelectorAll(".image-cell").forEach((cell) => {
    cell.addEventListener("click", (e) => {
      if (e.target.closest(".image-del")) return;
      openLightbox(Number(cell.dataset.idx));
    });
  });
  app.querySelectorAll("[data-del-image]").forEach((btn) => {
    btn.addEventListener("click", () => deleteImage(btn.dataset.delImage));
  });
}

function bindDeleteButtons() {
  app.querySelectorAll("[data-del-folder]").forEach((btn) => {
    btn.addEventListener("click", (e) => {
      e.preventDefault();
      e.stopPropagation();
      deleteFolder(btn.dataset.delFolder);
    });
  });
}

// ================= 删除 =================
async function deleteFolder(id) {
  const f = state.folders.find((x) => x.id === id);
  if (!confirm(`确定删除文件夹「${f ? f.title : ""}」吗?(${f ? f.count : 0} 条图片记录将被移除,图床文件保留)`)) return;
  try {
    await api(`/api/folders/${encodeURIComponent(id)}`, {
      method: "DELETE",
      headers: { "X-Auth-Code": state.authCode },
    });
    toast("文件夹已删除", "ok");
    if (state.currentFolderId === id) location.hash = "#/";
    else render();
  } catch (e) { toast(e.message, "err"); }
}
async function deleteImage(id) {
  if (!state.currentFolderId || !confirm("确定删除这张图片吗?(图床文件保留)")) return;
  try {
    await api(`/api/folders/${encodeURIComponent(state.currentFolderId)}/images/${encodeURIComponent(id)}`, {
      method: "DELETE",
      headers: { "X-Auth-Code": state.authCode },
    });
    toast("图片已删除", "ok");
    closeLightbox();
    render();
  } catch (e) { toast(e.message, "err"); }
}

// ================= 灯箱(PhotoSwipe) =================
const gallery = new PhotoSwipeLightbox({
  pswpModule: () => import("https://cdn.jsdelivr.net/npm/photoswipe@5.4.4/dist/photoswipe.esm.js"),
  history: false, // 自己管理 history,避免与 hash 路由冲突
  bgOpacity: 0.96,
  closeTitle: "关闭 (Esc)",
  zoomTitle: "缩放",
  arrowPrevTitle: "上一张",
  arrowNextTitle: "下一张",
});
new PhotoSwipeDynamicCaption(gallery, {
  type: "below",
  captionContent: (slide) => {
    const im = slide.data.image;
    if (!im) return "";
    const t = im.title ? `<div class="lb-title">${esc(im.title)}</div>` : "";
    const d = im.description ? `<div class="lb-desc">${esc(im.description)}</div>` : "";
    return t + d;
  },
});
gallery.init();

let pswp = null;          // 当前打开的 PhotoSwipe 实例
let lbHistoryPushed = false; // 打开灯箱时是否压入了 history 条目

gallery.on("beforeOpen", () => {
  pswp = gallery.pswp;
  history.pushState({ aigcLightbox: true }, "", location.href);
  lbHistoryPushed = true;
});
gallery.on("destroy", () => {
  pswp = null;
  // 灯箱经由 UI 关闭(X / Esc / 手势):回退掉压入的 history 条目
  if (lbHistoryPushed) {
    lbHistoryPushed = false;
    history.back();
  }
});
// 浏览器后退:关闭灯箱而不是离开页面
window.addEventListener("popstate", () => {
  if (pswp) {
    lbHistoryPushed = false;
    pswp.close();
  }
});

function openLightbox(idx) {
  if (!state.images.length) return;
  gallery.dataSource = state.images.map((im) => ({
    src: im.url,
    width: im.width || 1600,
    height: im.height || 1600,
    alt: im.title || "",
    image: im,
  }));
  gallery.loadAndOpen(idx);
}
function closeLightbox() {
  if (pswp) pswp.close();
}

// ================= 对话框 =================
function openDialog(id) { $(id).classList.add("open"); }
function closeDialog(id) { $(id).classList.remove("open"); }
document.querySelectorAll(".dialog-backdrop").forEach((bd) => {
  bd.addEventListener("click", (e) => { if (e.target === bd) bd.classList.remove("open"); });
  bd.querySelectorAll("[data-close]").forEach((b) =>
    b.addEventListener("click", () => bd.classList.remove("open")));
});

function openFolderDialog() {
  $("#folder-title").value = "";
  $("#folder-desc").value = "";
  setStatus("#folder-status", "");
  openDialog("#dlg-folder");
  $("#folder-title").focus();
}
async function submitFolder() {
  const title = $("#folder-title").value.trim();
  if (!title) return setStatus("#folder-status", "标题不能为空", "err");
  const btn = $("#btn-folder-submit");
  btn.disabled = true;
  try {
    await api("/api/folders", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ code: state.authCode, title, description: $("#folder-desc").value.trim() }),
    });
    closeDialog("#dlg-folder");
    toast("文件夹已创建", "ok");
    render();
  } catch (e) {
    setStatus("#folder-status", e.message, "err");
  } finally { btn.disabled = false; }
}

// ---- 上传 ----
function setStatus(sel, msg, cls = "") {
  const el = $(sel);
  el.textContent = msg;
  el.className = "form-status " + cls;
}
function openUpload(folderId) {
  if (!state.folders.length) { toast("请先创建文件夹", "err"); openFolderDialog(); return; }
  state.uploadFile = null; state.uploadThumb = null; state.uploadDims = null;
  $("#file-input").value = "";
  $("#pick-preview").style.display = "none";
  $("#pick-empty").style.display = "";
  $("#pick-zone").classList.remove("has-img");
  $("#img-title").value = ""; $("#img-desc").value = ""; $("#img-prompt").value = "";
  setStatus("#upload-status", "");
  const sel = $("#upload-folder");
  sel.innerHTML = state.folders.map((f) =>
    `<option value="${esc(f.id)}">${esc(f.title)}</option>`).join("");
  if (folderId) sel.value = folderId;
  openDialog("#dlg-upload");
}
async function handleFilePicked(file) {
  if (!file || !file.type.startsWith("image/")) return toast("请选择图片文件", "err");
  state.uploadFile = file;
  const url = URL.createObjectURL(file);
  try {
    const img = await loadImageEl(url);
    state.uploadDims = { width: img.naturalWidth, height: img.naturalHeight };
  } finally { URL.revokeObjectURL(url); }
  $("#pick-preview").src = URL.createObjectURL(file);
  $("#pick-preview").style.display = "";
  $("#pick-empty").style.display = "none";
  $("#pick-zone").classList.add("has-img");
  state.uploadThumb = await compressImage(file, THUMB_MAX, THUMB_MAX, 0.85);
}
async function submitUpload() {
  const file = state.uploadFile;
  if (!file) return setStatus("#upload-status", "请先选择图片", "err");
  const title = $("#img-title").value.trim();
  if (!title) return setStatus("#upload-status", "标题不能为空", "err");
  const folderId = $("#upload-folder").value;
  const description = $("#img-desc").value.trim();
  const prompt = $("#img-prompt").value.trim();

  const btn = $("#btn-upload-submit");
  btn.disabled = true;
  try {
    setStatus("#upload-status", "上传原图中 (1/2)…");
    const fd = new FormData();
    fd.append("code", state.authCode);
    fd.append("folderId", folderId);
    fd.append("file", file);
    fd.append("title", title);
    fd.append("description", description);
    fd.append("prompt", prompt);
    fd.append("width", state.uploadDims ? state.uploadDims.width : "");
    fd.append("height", state.uploadDims ? state.uploadDims.height : "");
    const r1 = await api("/api/upload", { method: "POST", body: fd });

    let thumbWarn = "";
    if (state.uploadThumb) {
      try {
        setStatus("#upload-status", "上传缩略图中 (2/2)…");
        const fd2 = new FormData();
        fd2.append("code", state.authCode);
        fd2.append("folderId", folderId);
        fd2.append("imageId", r1.imageId);
        fd2.append("file", state.uploadThumb, `${r1.imageId}__thumb.jpg`);
        await api("/api/upload", { method: "POST", body: fd2 });
      } catch (e) {
        thumbWarn = `(缩略图失败: ${e.message})`;
      }
    }
    closeDialog("#dlg-upload");
    toast("上传成功 " + thumbWarn, thumbWarn ? "" : "ok");
    if (state.currentFolderId === folderId || !location.hash.startsWith("#/f/")) render();
    else location.hash = "#/f/" + folderId;
  } catch (e) {
    setStatus("#upload-status", e.message, "err");
  } finally { btn.disabled = false; }
}

// ---- AI 识别 ----
async function aiDescribe() {
  if (!state.uploadFile) return setStatus("#upload-status", "请先选择图片再使用 AI 识别", "err");
  const btn = $("#btn-ai");
  btn.disabled = true;
  btn.classList.add("spinning");
  setStatus("#upload-status", "AI 识别中…");
  try {
    const compressed = await compressImage(state.uploadFile, AI_IMG_MAX, AI_IMG_MAX, 0.85);
    const fd = new FormData();
    fd.append("code", state.authCode);
    fd.append("prompt", $("#img-prompt").value.trim());
    fd.append("file", compressed, "ai-input.jpg");
    const r = await api("/api/ai-describe", { method: "POST", body: fd });
    if (r.title) $("#img-title").value = r.title;
    if (r.description) $("#img-desc").value = r.description;
    setStatus("#upload-status", "已回填标题与描述", "ok");
  } catch (e) {
    setStatus("#upload-status", e.message, "err");
  } finally {
    btn.disabled = false;
    btn.classList.remove("spinning");
  }
}

// ================= 事件绑定 =================
$("#btn-unlock").addEventListener("click", () => tryAuth($("#auth-input").value));
$("#auth-input").addEventListener("keydown", (e) => { if (e.key === "Enter") tryAuth($("#auth-input").value); });
$("#btn-lock").addEventListener("click", lock);
$("#btn-new-folder").addEventListener("click", openFolderDialog);
$("#btn-new-folder-inline").addEventListener("click", openFolderDialog);
$("#btn-folder-submit").addEventListener("click", submitFolder);
$("#folder-title").addEventListener("keydown", (e) => { if (e.key === "Enter") submitFolder(); });
$("#btn-upload").addEventListener("click", () => openUpload(state.currentFolderId));
$("#btn-upload-submit").addEventListener("click", submitUpload);
$("#btn-ai").addEventListener("click", aiDescribe);

$("#pick-zone").addEventListener("click", () => $("#file-input").click());
$("#file-input").addEventListener("change", (e) => handleFilePicked(e.target.files[0]));
$("#pick-zone").addEventListener("dragover", (e) => { e.preventDefault(); $("#pick-zone").classList.add("drag"); });
$("#pick-zone").addEventListener("dragleave", () => $("#pick-zone").classList.remove("drag"));
$("#pick-zone").addEventListener("drop", (e) => {
  e.preventDefault();
  $("#pick-zone").classList.remove("drag");
  handleFilePicked(e.dataTransfer.files[0]);
});

window.addEventListener("hashchange", render);
window.openUpload = openUpload;

// ================= 启动 =================
(async function init() {
  render();
  if (state.authCode) {
    const ok = await tryAuth(state.authCode, { silent: true });
    if (!ok) toast("已保存的认证码已失效,请重新输入", "");
  }
})();
</script>
